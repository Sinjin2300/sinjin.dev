{{ define "main" }}
<div class="w-full md:w-3/4 lg:w-1/2 mx-auto py-12 px-4">
    <div class="max-w-3xl mx-auto p-4 md:p-8 border border-border-primary-light dark:border-border-primary-dark rounded-2xl bg-neutral-50 dark:bg-neutral-800">
        <h1 class="text-4xl font-bold mb-4 text-text-primary-light dark:text-text-primary-dark">{{ .Title }}</h1>
        {{ if eq .Section "blog" }}
            <div class="flex flex-col gap-3 mb-8 text-text-secondary-light dark:text-text-secondary-dark">
                <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
                {{ with .Params.tags }}
                <div class="flex gap-2 flex-wrap">
                    {{ range . }}
                    <a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}" class="px-3 py-1 bg-bg-primary-light dark:bg-bg-tertiary-dark rounded-md text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark hover:bg-accent-light dark:hover:bg-accent-dark hover:text-white transition-colors">
                        #{{ . }}
                    </a>
                    {{ end }}
                </div>
                {{ end }}
            </div>
        {{ end }}
        
        <div class="prose prose-invert max-w-none blog-content">
            {{ .Content }}
        </div>
    </div>
</div>

<style>
/* Prose heading styles */
.prose h1 { font-size: 2.25rem !important; font-weight: 700 !important; margin-top: 2rem !important; margin-bottom: 1rem !important; }
.prose h2 { font-size: 1.875rem !important; font-weight: 600 !important; margin-top: 1.75rem !important; margin-bottom: 0.875rem !important; }
.prose h3 { font-size: 1.5rem !important; font-weight: 600 !important; margin-top: 1.5rem !important; margin-bottom: 0.75rem !important; }
.prose h4 { font-size: 1.25rem !important; font-weight: 600 !important; margin-top: 1.25rem !important; margin-bottom: 0.5rem !important; }
.prose p { margin-top: 1rem; margin-bottom: 1rem; line-height: 1.7; }

/* Style links in blog content */
.blog-content a {
    color: #3b82f6; /* Blue color for light mode */
    text-decoration: underline;
    transition: color 0.2s ease;
}

.blog-content a:hover {
    color: #2563eb; /* Darker blue on hover for light mode */
}

/* Dark mode link colors */
html.dark .blog-content a {
    color: #60a5fa; /* Lighter blue for dark mode */
}

html.dark .blog-content a:hover {
    color: #93c5fd; /* Even lighter blue on hover for dark mode */
}
</style>
{{ end }}
